<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="">
      <span>Games &amp; Immersive Media<br><small>Module Handbook · SPO Version 10</small></span>
    </a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Overview</a>
      <a href="{{ '/modules/' | relative_url }}">Modules</a>
    </nav>
  </header>
  <main class="page-shell">{{ content }}</main>
  <footer class="site-footer">
    <span>Hochschule Furtwangen · Computer Science and Applications</span>
  </footer>
</body>
</html>
